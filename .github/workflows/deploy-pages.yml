name: Deploy Flight3d to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight3d-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - name: Verify deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set the CLOUDFLARE_API_TOKEN repository secret with Cloudflare Pages Edit permission.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo '::error::Set the CLOUDFLARE_ACCOUNT_ID repository secret for the target Cloudflare account.'; exit 1; }
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Create Pages project if needed
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const base = `https://api.cloudflare.com/client/v4/accounts/${process.env.CLOUDFLARE_ACCOUNT_ID}/pages/projects`;
          const headers = {
            Authorization: `Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,
            'Content-Type': 'application/json',
          };
          const existing = await fetch(`${base}/flight3d`, { headers });
          if (existing.ok) {
            console.log('Using existing flight3d Pages project.');
          } else if (existing.status === 404) {
            const created = await fetch(base, {
              method: 'POST', headers,
              body: JSON.stringify({ name: 'flight3d', production_branch: 'main' }),
            });
            const result = await created.json();
            if (!created.ok || !result.success) throw new Error(`Pages project creation failed (HTTP ${created.status}): ${JSON.stringify(result.errors)}`);
            console.log('Created flight3d Pages project.');
          } else {
            throw new Error(`Pages project lookup failed (HTTP ${existing.status}); check account and Pages permissions.`);
          }
          NODE
      - name: Deploy production build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4.151.1 pages deploy dist --project-name flight3d --branch main --commit-hash "$GITHUB_SHA"
